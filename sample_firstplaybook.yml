# This is the first play
# - name: "install and show tree task"            # name of the play, which is a human-readable description of what the play is intended to accomplish. This is optional but recommended for clarity and documentation purposes.
#   gather_facts: no                              # gather_facts is a directive that tells Ansible whether to collect facts about the target hosts before executing the tasks in the play. Setting it to "no" means that Ansible will not gather facts, which can speed up the execution of the playbook if the tasks do not require any information about the target hosts.
#   hosts: ubuntu_servers                         # hosts is a directive that specifies the target hosts or groups of hosts on which the tasks in the play will be executed. In this case, it is set to "ubuntu_servers", which means that the tasks will be executed on all hosts that are part of the "ubuntu_servers" group defined in the inventory file.
#   tasks:                                        # list of tasks to be executed on the target hosts specified in the play
#    -          
#     This is task 1         
#     name: "install tree package"                # name of the task, which is a human-readable description of what the task is intended to accomplish. This is optional but recommended for clarity and documentation purposes.
#     pip:                                        # pip is a module that allows you to manage Python packages on the target hosts. In this case, it is being used to install the "tree" package.
#      name:                                      # name is a parameter of the pip module that specifies the name of the package to be installed. In this case, it is set to "tree", which means that Ansible will attempt to install the "tree" package on the target hosts specified in the play.
#       - tree          
#      state: present                             # state is a parameter of the pip module that specifies the desired state of the package. Setting it to "present" means that Ansible will ensure that the "tree" package is installed on the target hosts. If the package is already installed, Ansible will not take any action. If it is not installed, Ansible will attempt to install it.
#    -          
#     This is task 2         
#     name: "show tree task"                      # name of the task, which is a human-readable description of what the task is intended to accomplish. This is optional but recommended for clarity and documentation purposes.
#     raw: pip show tree                          # raw is a module that allows you to execute raw commands on the target hosts. In this case, it is being used to execute the command "pip show tree", which will display information about the "tree" package installed on the target hosts. This task is intended to verify that the "tree" package was successfully installed in the previous task.

# This is the second play         
- name: actions on the cx switches.          
  hosts: all          
  gather_facts: no          
  #commands: hostname                             # this is a task that executes the "hostname" command on all target hosts specified in the play. This task is intended to display the hostname of each target host, which can be useful for verification and troubleshooting purposes.
  vars:                                           # variables that can be used within the playbook to store values that can be referenced in tasks and other parts of the playbook. In this case, it is used to define connection parameters for the target hosts specified in the play.
   ansible_connection: httpapi                    # connection plugin used by Ansible to connect to the target device specified in the playbook. httpapi is used for network devices that support REST APIs
   ansible_network_os: arubanetworks.aoscx.aoscx
   http_port: 80                                  # this is a variable that can be used within the playbook to specify the HTTP port to be used when connecting to the target device(s) specified in the play. This variable can be referenced in tasks and other parts of the playbook to ensure that the correct port is used for communication with the target device(s).
   vlans:                                         # this is a variable that can be used within the playbook to define a list of VLANs to be created and configured on the target device(s) specified in the play. Each VLAN is represented as a dictionary with an "id", "name", and "ports" key, which specify the VLAN ID, VLAN name, and list of ports to be assigned to the VLAN, respectively. This variable can be referenced in tasks and other parts of the playbook to create and configure the specified VLANs on the target device(s). 
    - id: 10
      name: vlan10
      ports: [1, 2, 3]                            # this is a list of ports that are assigned to the VLAN. In this case, ports 1, 2, and 3 are assigned to VLAN 10. This information can be used in tasks and other parts of the playbook to ensure that the correct ports are configured for the VLAN on the target device(s).
    - id: 20
      name: vlan20
      ports: [4, 5, 6]                            # this is a list of ports that are assigned to the VLAN. In this case, ports 4, 5, and 6 are assigned to VLAN 20. This information can be used in tasks and other parts of the playbook to ensure that the correct ports are configured for the VLAN on the target device(s).
   tasks:                                         # list of tasks to be executed on the target hosts specified in the play
    - name: create vlan 10 and 20 and assign ports 1-3 to vlan 10 and ports 4-6 to vlan 20
      arubanetworks.aoscx.aoscx_vlan:             # this is a task that uses the arubanetworks.aoscx.aoscx_vlan module to create VLANs and assign ports to them on the target device(s) specified in the play. The vlan_id, name, and ports parameters are set using the values defined in the vlans variable, which allows for dynamic creation and configuration of VLANs based on the data provided in the variable. 
       vlan_id: "{{ vlans['id']}}"                # this is a parameter of the arubanetworks.aoscx.aoscx_vlan module that specifies the VLAN ID to be created and configured on the target device(s) specified in the play. The value is set using the "id" key from the vlans variable, which allows for dynamic assignment of VLAN IDs based on the data provided in the variable.
       name: "{{ vlans['name'] }}"                # this is a parameter of the arubanetworks.aoscx.aoscx_vlan module that specifies the name of the VLAN to be created and configured on the target device(s) specified in the play. The value is set using the "name" key from the vlans variable, which allows for dynamic assignment of VLAN names based on the data provided in the variable.
       ports: 1/1/{{ vlans['ports'] }}            # this is a parameter of the arubanetworks.aoscx.aoscx_vlan module that specifies the ports to be assigned to the VLAN. The value is set using the "ports" key from the vlans variable, which allows for dynamic assignment of ports based on the data provided in the variable.
      loop: "{{ vlans }}"                         # this is a directive that tells Ansible to loop over the items in the vlans variable and execute the task for each item in the list. This allows for dynamic creation and configuration of VLANs based on the data provided in the vlans variable, which can contain multiple VLAN definitions.
      register: vlan_result                       # this is a directive that tells Ansible to store the result of the task in a variable called vlan_result. This variable can be referenced in subsequent tasks or used for debugging and troubleshooting purposes to verify that the VLANs were created and configured successfully on the target device(s).
      debug: var=vlan_result                      # this is a task that uses the debug module to display the contents of the vlan_result variable, which contains the result of the previous task that created and configured VLANs on the target device(s). This can be useful for verifying that the VLANs were created and configured successfully, as well as for troubleshooting any issues that may arise during the execution of the playbook.




